name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o Camsansung-project.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle wrapper
        working-directory: extracted/Camsansung
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: extracted/Camsansung
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: camsansung-debug-apk
          path: extracted/Camsansung/app/build/outputs/apk/debug/app-debug.apk
